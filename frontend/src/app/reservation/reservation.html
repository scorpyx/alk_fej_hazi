<div class="card flex justify-center">
<form #exampleForm="ngForm" (ngSubmit)="onSubmit(exampleForm)" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
        <p-datepicker name="date" [inline]="true" [showTime]="true" [invalid]="dateModel.invalid && (dateModel.touched || exampleForm.submitted)" #dateModel="ngModel" [(ngModel)]="date" required />
    </div>
    <button pButton severity="secondary" type="submit"><span pButtonLabel>Submit</span></button>
      <p-overlaybadge [value]="twoSeatTable()">
         <div [style]="twoSeatSelected ? {'border': '1px solid #000 !important', 'width' : 'max-content' } : {'border' : '0px solid #000 !important', 'width' : 'max-content' }">
            <img src="/two_seats_small.png" (click)="twoSeatToggle()"/>
         </div>
      </p-overlaybadge>
    <p-overlaybadge [value]="fourSeatTable()">
       <div [style]="fourSeatSelected ? {'border': '1px solid #000 !important', 'width' : 'max-content' } : {'border' : '0px solid #000 !important', 'width' : 'max-content' }">
            <img src="/four_seats_small.png" (click)="fourSeatToggle()"/>
         </div>
    </p-overlaybadge>
    <p-overlaybadge [value]="tenSeatTable()">
       <div [style]="tenSeatSelected ? {'border': '1px solid #000 !important', 'width' : 'max-content' } : {'border' : '0px solid #000 !important', 'width' : 'max-content' }">
            <img src="/ten_seats_small.png" (click)="tenSeatToggle()"/>
         </div>
    </p-overlaybadge>
</form>
</div>
